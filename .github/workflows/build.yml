name: Homedroid KR APK

# 갤럭시 노트10(arm64-v8a)에서 바로 설치할 수 있는 홈드로이드 KR APK를 만든다.
#
# 이 워크플로는 서명 키를 갖지 않는다. 저장소 시크릿을 쓸 수 없는 환경이라, 빌드는
# -PhomedroidUnsigned=true 로 서명 없이 APK를 만들고 아티팩트로 올린다. 서명은 빌드가 끝난 뒤
# .kr/signing/gene-homedroid-kr.p12 로 붙이고, 서명본을 GitHub Release에 올린다.
on:
  push:
    branches: [homedroid-kr]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Cache native sources
        uses: actions/cache@v4
        with:
          path: |
            native/.work/*.tar.*
            ~/go/pkg/mod
          key: native-arm64-${{ hashFiles('native/*.sh', 'native/go-security-deps.txt', 'native/sshd/go.sum') }}

      - name: Build native binaries (arm64-v8a only)
        run: native/build-all.sh arm64-v8a

      # 휴대폰에서 직접 AI 모델을 돌리는 런타임. 실패해도 APK는 만들어진다(그 기능만 빠짐).
      - name: Build the on-phone AI runtime (llama.cpp, arm64-v8a)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ninja-build glslc > /dev/null
          native/build-llama.sh arm64-v8a

      - name: Korean dashboard tests
        run: |
          node tests/ipcam-dashboard.test.cjs
          node tests/cluster-dashboard.test.cjs
          node tests/mobile-dashboard.test.cjs
          node tests/network-dashboard.test.cjs

      - name: Unit tests, lint and unsigned release APKs
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease -PhomedroidUnsigned=true

      - name: List APKs
        run: ls -l app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: homedroid-kr-apks
          path: |
            app/build/outputs/apk/release/*.apk
            native/out/llama-runtime-*.tar.gz
          if-no-files-found: error
