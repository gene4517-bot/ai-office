<style>
  :root{
    --bg:#0b0908; --panel:#15110d; --card:#1d1711; --card2:#231c15; --line:#33281d;
    --ink:#f6efe4; --dim:#bda98f; --dim2:#8a7660;
    --gold:#f5b866; --ok:#6ee7b7; --meet:#7dd3fc; --brk:#fbbf24; --idle:#cbd5e1; --off:#94a3b8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased}
  body{overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;min-height:0}
  #body{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}

  /* ---------- top bar ---------- */
  #topbar{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 11px;
    background:linear-gradient(180deg,#1b1510,#120e0a);border-bottom:1px solid var(--line);z-index:6}
  .brand{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
  .logo{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;flex:0 0 auto;
    background:linear-gradient(150deg,#f7c884,#e08b4c);color:#3a2410;font-weight:900;box-shadow:0 2px 8px rgba(224,139,76,.35)}
  .brand b{display:block;font-size:13px;letter-spacing:-.3px;white-space:nowrap;line-height:1.2}
  .brand small{display:block;font-size:10px;color:var(--dim2);font-variant-numeric:tabular-nums;letter-spacing:.2px}
  #phases{margin-left:auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0;flex:0 1 auto;min-width:0}
  #phases::-webkit-scrollbar{display:none}
  #phases button{flex:0 0 auto;font:700 11px/1 inherit;color:var(--dim);background:#1a140f;border:1px solid #33281d;
    padding:6px 9px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:.15s}
  #phases button.on{color:#2a1a08;background:linear-gradient(160deg,#ffd79b,#f0b064);border-color:#ffd79b;
    box-shadow:0 2px 10px rgba(240,176,100,.25)}

  /* ---------- stage ---------- */
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#1a1410 0%,#0a0807 100%)}
  #cv{display:block;width:100%;height:100%;touch-action:none}
  .hud{position:absolute;left:8px;top:8px;display:flex;gap:3px;flex-wrap:nowrap;max-width:calc(100% - 56px);pointer-events:none;overflow:hidden}
  .hud span{font:700 9px/1 inherit;padding:3.5px 5px;border-radius:7px;background:rgba(20,15,11,.72);
    border:1px solid rgba(245,184,102,.14);color:#cbb79c;backdrop-filter:blur(6px);white-space:nowrap}
  .hud span i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:3px;vertical-align:middle}
  .zoomctl{position:absolute;right:9px;bottom:9px;display:flex;flex-direction:column;gap:6px;z-index:4}
  .zoomctl button{width:34px;height:34px;border-radius:10px;background:rgba(26,20,15,.86);border:1px solid var(--line);
    color:var(--ink);font-size:15px;line-height:1;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
  .zoomctl button:active{background:#2a2117}
  .zoomctl .fit{font-size:11px;font-weight:800;letter-spacing:-.4px}

  /* ---------- panel ---------- */
  #panel{flex:0 0 auto;max-height:48vh;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);z-index:5}
  .phead{flex:0 0 auto;padding:9px 12px 8px;border-bottom:1px solid var(--line)}
  .prow{display:flex;align-items:center;gap:9px}
  .prow .av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:12px;
    color:#2a1a08;background:linear-gradient(145deg,#ffd79b,#e59a52);flex:0 0 auto;box-shadow:inset 0 -8px 14px rgba(0,0,0,.14)}
  .pname{font-size:13.5px;font-weight:800;line-height:1.2}
  .psub{font-size:10.5px;color:var(--dim);margin-top:2px}
  .live{display:flex;align-items:center;gap:4px;margin-left:auto;font:800 9.5px/1 inherit;color:#0f1a12;
    background:#6ee7b7;padding:5px 7px;border-radius:999px;flex:0 0 auto}
  .live i{width:5px;height:5px;border-radius:50%;background:#0f1a12;animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .stats{display:flex;gap:5px;margin-top:8px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 7px}
  .stat b{display:block;font-size:15px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
  .stat span{font-size:9.5px;color:var(--dim2)}

  .tabs{display:flex;gap:4px;padding:7px 9px 0;flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;padding:7px 9px;border-radius:9px 9px 0 0;background:transparent;border:1px solid transparent;border-bottom:none;
    color:var(--dim);font:700 11.5px/1 inherit;cursor:pointer;white-space:nowrap}
  .tabs button.on{background:var(--card);border-color:var(--line);color:var(--ink)}
  .pane{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);
    border-top:1px solid var(--line);padding:9px 10px calc(14px + env(safe-area-inset-bottom))}
  .pane[hidden]{display:none}

  .boardrow{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:10px;background:var(--card2);
    border:1px solid var(--line);margin-bottom:6px}
  .boardrow .lab{font-size:11px;color:var(--dim)}
  .boardrow .val{margin-left:auto;font-size:15px;font-weight:800;letter-spacing:-.4px}
  .mini{font-size:10px;color:var(--dim2);margin:8px 2px 6px;font-weight:700}
  .tick{font-size:10.5px;color:#9fd8c6;background:#122a24;border:1px solid #1e4038;border-radius:8px;padding:7px 9px;line-height:1.5}

  .task{display:flex;gap:9px;padding:9px;border-radius:10px;background:var(--card2);border:1px solid var(--line);margin-bottom:7px}
  .task .ico{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:11px;flex:0 0 auto;font-weight:900}
  .task .tt{font-size:11.5px;font-weight:800;line-height:1.35}
  .task .tn{font-size:10px;color:var(--dim);margin-top:3px}
  .bar{height:4px;border-radius:2px;background:#120e0a;margin-top:7px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:2px}
  .tmeta{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:9.5px;color:var(--dim2)}
  .tmeta .who{color:#e6d3b8}

  .srow{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;background:var(--card2);
    border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
  .srow.sel{border-color:#f5b866;box-shadow:0 0 0 1px rgba(245,184,102,.35) inset}
  .sav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
  .sname{display:block;font-size:11.5px;font-weight:800;line-height:1.25}
  .stask{display:block;font-size:9.5px;color:var(--dim2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
  .badge{margin-left:auto;font:800 9px/1 inherit;padding:4px 6px;border-radius:999px;flex:0 0 auto;white-space:nowrap}

  .lrow{display:flex;gap:8px;padding:8px 3px;border-bottom:1px dashed rgba(245,184,102,.10);font-size:11px;line-height:1.4}
  .lrow .t{color:var(--dim2);font-variant-numeric:tabular-nums;flex:0 0 auto;font-size:10px;padding-top:1px}
  .lrow .w{font-weight:800;flex:0 0 auto;color:#f0d7b4}
  .lrow .x{color:#b9a68e;min-width:0}
  .lrow.live .w{color:#7ff0d8}
  .lrow .tag{font:800 8.5px/1 inherit;color:#0b1a18;background:#6ee7b7;padding:2px 4px;border-radius:4px;margin-left:auto;flex:0 0 auto;align-self:center}
  .empty{color:var(--dim2);font-size:11px;padding:18px 2px;text-align:center}

  @media (min-width:900px) and (min-aspect-ratio:1/1){
    #body{flex-direction:row}
    #panel{width:410px;max-height:none;height:auto;border-top:0;border-left:1px solid var(--line)}
    .brand b{font-size:14px}
    .hud span{font-size:10.5px;padding:5px 7px}
    .stask{max-width:250px}
  }
  @media (max-height:640px){ .phead{padding:6px 10px 6px} .stat b{font-size:13.5px} .stats{margin-top:5px} }
</style>
</head>

    document.getElementById('stDone').textContent = d.stats.done;
    document.getElementById('stProg').textContent = d.stats.progress;
    document.getElementById('stWait').textContent = d.stats.waiting;
  }
  document.getElementById('stStaff').textContent = d.staff.length;
  renderAll();

}
function pushLog(who, text, tone) {
  const d = new Date();
  logs.unshift({ time: pad2(d.getHours()) + ':' + pad2(d.getMinutes()), who, text, tone: tone || '', live: true });
  if (logs.length > 60) logs.pop();
  renderLog();
}

/* =========================================================
   6. 캐릭터 그리기
   ========================================================= */
const SP = {
  bear:    { face: '#d9a066', ear: 'round',  ec: '#c48a52' },
  rabbit:  { face: '#fbf3e8', ear: 'long',   ec: '#f3e6d6' },
  fox:     { face: '#f3a35e', ear: 'point',  ec: '#dd8639' },
  cat:     { face: '#f7e0c0', ear: 'point',  ec: '#e5c6a0' },
  panda:   { face: '#fdf8f0', ear: 'round',  ec: '#2f2f33', patch: true },
  koala:   { face: '#c9ced6', ear: 'big',    ec: '#b3b9c2' },
  owl:     { face: '#c9a227', ear: 'tuft',   ec: '#a8871f' },
  chick:   { face: '#ffe27a', ear: 'tuft',   ec: '#f2cb3d', beak: true },
  hamster: { face: '#e8c39e', ear: 'round',  ec: '#d3a97f' },
  frog:    { face: '#88cf5c', ear: 'frog',   ec: '#78bd4c' },
  penguin: { face: '#f6f7f9', ear: 'none',   ec: '#1f2937', hood: '#242e3d' },
  deer:    { face: '#d9a066', ear: 'antler', ec: '#a87a4a' },
  pickle:  { face: '#7dd3fc', ear: 'none',   ec: '#38bdf8', pickle: true },
  dog:     { face: '#eccb9f', ear: 'floppy', ec: '#d3b184' }
};

function drawEars(g, sp, hy, r) {
  const ol = 'rgba(70,42,22,0.30)';
  g.fillStyle = sp.ec; g.strokeStyle = ol; g.lineWidth = 1.6;
  const circ = (x, y, rr2) => { g.beginPath(); g.arc(x, y, rr2, 0, TAU); g.fill(); g.stroke(); };
  switch (sp.ear) {
    case 'round':
      circ(-r * 0.82, hy - r * 0.84, r * 0.46);
      circ(r * 0.82, hy - r * 0.84, r * 0.46);
      g.fillStyle = 'rgba(255,255,255,0.18)';
      g.beginPath(); g.arc(-r * 0.82, hy - r * 0.84, r * 0.24, 0, TAU); g.fill();
      g.beginPath(); g.arc(r * 0.82, hy - r * 0.84, r * 0.24, 0, TAU); g.fill();
      break;
    case 'long':
      g.beginPath(); g.ellipse(-r * 0.44, hy - r * 1.36, r * 0.24, r * 0.62, -0.12, 0, TAU); g.fill(); g.stroke();
      g.beginPath(); g.ellipse(r * 0.44, hy - r * 1.36, r * 0.24, r * 0.62, 0.12, 0, TAU); g.fill(); g.stroke();
      g.fillStyle = 'rgba(240,160,160,0.55)';
      g.beginPath(); g.ellipse(-r * 0.44, hy - r * 1.34, r * 0.11, r * 0.4, -0.12, 0, TAU); g.fill();
      g.beginPath(); g.ellipse(r * 0.44, hy - r * 1.34, r * 0.11, r * 0.4, 0.12, 0, TAU); g.fill();
      break;
    case 'point':
      g.beginPath(); g.moveTo(-r * 1.02, hy - r * 0.35); g.lineTo(-r * 0.62, hy - r * 1.32); g.lineTo(-r * 0.12, hy - r * 0.78); g.closePath(); g.fill(); g.stroke();
      g.beginPath(); g.moveTo(r * 1.02, hy - r * 0.35); g.lineTo(r * 0.62, hy - r * 1.32); g.lineTo(r * 0.12, hy - r * 0.78); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.22)';
      g.beginPath(); g.moveTo(-r * 0.78, hy - r * 0.62); g.lineTo(-r * 0.6, hy - r * 1.12); g.lineTo(-r * 0.38, hy - r * 0.8); g.closePath(); g.fill();
      break;
    case 'big':
      circ(-r * 0.9, hy - r * 0.5, r * 0.56);
      circ(r * 0.9, hy - r * 0.5, r * 0.56);
      g.fillStyle = 'rgba(255,255,255,0.22)';
      g.beginPath(); g.arc(-r * 0.9, hy - r * 0.5, r * 0.3, 0, TAU); g.fill();
      g.beginPath(); g.arc(r * 0.9, hy - r * 0.5, r * 0.3, 0, TAU); g.fill();
      break;
    case 'tuft':
      g.beginPath(); g.moveTo(-r * 0.3, hy - r * 0.85); g.lineTo(0, hy - r * 1.6); g.lineTo(r * 0.3, hy - r * 0.85); g.closePath(); g.fill(); g.stroke();
      break;
    case 'antler':
      g.strokeStyle = sp.ec; g.lineWidth = r * 0.16; g.lineCap = 'round';
      g.beginPath();
      g.moveTo(-r * 0.45, hy - r * 0.9); g.lineTo(-r * 0.75, hy - r * 1.55);
      g.moveTo(-r * 0.62, hy - r * 1.24); g.lineTo(-r * 0.98, hy - r * 1.36);
      g.moveTo(r * 0.45, hy - r * 0.9); g.lineTo(r * 0.75, hy - r * 1.55);
      g.moveTo(r * 0.62, hy - r * 1.24); g.lineTo(r * 0.98, hy - r * 1.36);
      g.stroke();
      g.fillStyle = sp.ec;
      g.beginPath(); g.ellipse(-r * 0.9, hy - r * 0.5, r * 0.26, r * 0.4, -0.5, 0, TAU); g.fill();
      g.beginPath(); g.ellipse(r * 0.9, hy - r * 0.5, r * 0.26, r * 0.4, 0.5, 0, TAU); g.fill();
      break;
    case 'floppy':
      g.beginPath(); g.ellipse(-r * 0.98, hy - r * 0.05, r * 0.3, r * 0.58, -0.22, 0, TAU); g.fill(); g.stroke();
      g.beginPath(); g.ellipse(r * 0.98, hy - r * 0.05, r * 0.3, r * 0.58, 0.22, 0, TAU); g.fill(); g.stroke();
      break;
    case 'frog':
      circ(-r * 0.66, hy - r * 0.82, r * 0.4);
      circ(r * 0.66, hy - r * 0.82, r * 0.4);
      break;
  }
}

function drawChar(g, ch, t) {
  const seated = ch.pose === 'seated';
  const walking = ch.moving;
  const sp = SP[ch.species] || SP.bear;
  const s = (seated ? 1.0 : 1.14) * ch.scale;
  const bob = walking ? Math.abs(Math.sin(ch.walk)) * 2.4 : Math.sin(t * 1.6 + ch.seed) * 0.8;
  const x = ch.x, y = ch.y - bob;
  const yo = seated ? -7 : 0;
  const OL = 'rgba(72,44,22,0.30)';

  // 바닥 그림자
  g.save();
  g.globalAlpha = walking ? 0.20 : 0.28;
  g.fillStyle = '#2a1706';
  g.beginPath(); g.ellipse(x, ch.y + 2, 16 * s, 6 * s, 0, 0, TAU); g.fill();
  g.restore();

  g.save();
  g.translate(x, y + yo);
  g.scale(s, s);

  // 다리
  if (!seated) {
    const sw = walking ? Math.sin(ch.walk) * 4 : 0;
    g.fillStyle = '#4a3524'; g.strokeStyle = OL; g.lineWidth = 1.2;
    rr(g, -9 + sw, -17, 7.5, 17, 3.5); g.fill(); g.stroke();
    rr(g, 1.5 - sw, -17, 7.5, 17, 3.5); g.fill(); g.stroke();
    g.fillStyle = '#2b1d12';
    rr(g, -10.5 + sw, -5, 9.5, 5, 2.2); g.fill();
    rr(g, 1 - sw, -5, 9.5, 5, 2.2); g.fill();
  }

  // 몸통 (후드)
  const bodyTop = seated ? -44 : -48;
  const bodyH = 29;
  const bg = g.createLinearGradient(0, bodyTop, 0, bodyTop + bodyH);
  bg.addColorStop(0, shade(ch.color, 18));
  bg.addColorStop(0.55, ch.color);
  bg.addColorStop(1, shade(ch.color, -34));
  g.fillStyle = bg;
  g.strokeStyle = OL; g.lineWidth = 1.5;
  rr(g, -13.5, bodyTop, 27, bodyH, 11); g.fill(); g.stroke();
  // 후드 목선
  g.fillStyle = 'rgba(255,255,255,0.75)';
  rr(g, -6, bodyTop + 1, 12, 5, 3); g.fill();
  // 지퍼
  g.strokeStyle = 'rgba(0,0,0,0.16)'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(0, bodyTop + 6); g.lineTo(0, bodyTop + bodyH - 5); g.stroke();
  // 명찰
  g.fillStyle = 'rgba(255,250,240,0.95)'; g.strokeStyle = 'rgba(90,60,30,0.35)'; g.lineWidth = 1;
  rr(g, 4, bodyTop + 13, 7, 5, 1.4); g.fill(); g.stroke();

  // 팔
  const armY = bodyTop + (seated ? 8 : 9);
  const armC = shade(ch.color, -20);
  if (seated) {
    const tp = ch.status === 'idle' ? 0 : Math.sin(t * 10 + ch.seed) * 1.6;
    g.fillStyle = armC; g.strokeStyle = OL; g.lineWidth = 1.3;
    rr(g, -17.5, armY + tp, 7, 15, 3.4); g.fill(); g.stroke();
    rr(g, 10.5, armY - tp, 7, 15, 3.4); g.fill(); g.stroke();
    g.fillStyle = sp.face; g.strokeStyle = OL;
    g.beginPath(); g.arc(-14, armY + tp + 15, 3.8, 0, TAU); g.fill(); g.stroke();
    g.beginPath(); g.arc(14, armY - tp + 15, 3.8, 0, TAU); g.fill(); g.stroke();
  } else {
    const sw = walking ? Math.sin(ch.walk) * 3 : 0;
    g.fillStyle = armC; g.strokeStyle = OL; g.lineWidth = 1.3;
    rr(g, -18, armY + sw, 7, 17, 3.4); g.fill(); g.stroke();
    rr(g, 11, armY - sw, 7, 17, 3.4); g.fill(); g.stroke();
    g.fillStyle = sp.face; g.strokeStyle = OL;
    g.beginPath(); g.arc(-14.5, armY + sw + 17, 4, 0, TAU); g.fill(); g.stroke();
    g.beginPath(); g.arc(14.5, armY - sw + 17, 4, 0, TAU); g.fill(); g.stroke();
    if (ch.action === 'break' && !walking) {
      g.fillStyle = '#fdf6ea'; g.strokeStyle = 'rgba(120,90,60,0.35)'; g.lineWidth = 1;
      rr(g, 13, armY + sw + 9, 9, 10, 2.5); g.fill(); g.stroke();
      g.fillStyle = '#a9764f'; g.fillRect(14.2, armY + sw + 10.2, 6.6, 2.4);
      g.strokeStyle = 'rgba(255,255,255,0.65)'; g.lineWidth = 1.1;
      g.beginPath(); g.moveTo(17.5, armY + sw + 7); g.quadraticCurveTo(16, armY + sw + 2, 18.5, armY + sw - 2); g.stroke();
    }
    if (ch.action === 'meeting' && !walking) {
      g.fillStyle = '#f6efe4'; g.strokeStyle = 'rgba(120,90,60,0.3)'; g.lineWidth = 1;
      rr(g, -22, armY + 6, 10, 12, 2); g.fill(); g.stroke();
      g.strokeStyle = '#b9a68e'; g.lineWidth = 0.9;
      for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-20, armY + 9 + i * 3); g.lineTo(-14, armY + 9 + i * 3); g.stroke(); }
    }
  }

  // 머리
  const hy = seated ? -57 : -61;
  const r = 17;
  drawEars(g, sp, hy, r);

  if (sp.hood) {
    g.fillStyle = sp.hood; g.strokeStyle = OL; g.lineWidth = 1.5;
    g.beginPath(); g.arc(0, hy, r + 1, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = sp.face;
    g.beginPath(); g.ellipse(0, hy + 3.5, r * 0.8, r * 0.74, 0, 0, TAU); g.fill();
  } else {
    const hg = g.createRadialGradient(-4, hy - 6, 3, 0, hy, r * 1.15);
    hg.addColorStop(0, shade(sp.face, 14));
    hg.addColorStop(1, shade(sp.face, -12));
    g.fillStyle = hg; g.strokeStyle = OL; g.lineWidth = 1.5;
    g.beginPath(); g.arc(0, hy, r, 0, TAU); g.fill(); g.stroke();
    // 볼륨 음영
    g.fillStyle = 'rgba(120,70,40,0.10)';
    g.beginPath(); g.ellipse(0, hy + r * 0.55, r * 0.8, r * 0.4, 0, 0, TAU); g.fill();
  }

  if (sp.pickle) {
    g.fillStyle = 'rgba(255,255,255,0.95)';
    g.font = fw(900, 17);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('ㅎ', 0, hy + 6);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  } else if (sp.patch) {
    g.fillStyle = '#33343a';
    g.beginPath(); g.ellipse(-6.8, hy - 1, 5, 5.8, -0.3, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(6.8, hy - 1, 5, 5.8, 0.3, 0, TAU); g.fill();
  }

  // 얼굴
  const blink = Math.sin(t * 1.7 + ch.seed * 4) > 0.982;
  if (!sp.pickle) {
    g.fillStyle = sp.patch ? '#fdf8f0' : '#2a2016';
    if (blink) {
      g.fillRect(-7.2, hy - 0.5, 4.8, 1.6); g.fillRect(2.4, hy - 0.5, 4.8, 1.6);
    } else {
      g.beginPath(); g.arc(-4.8, hy, 2.6, 0, TAU); g.fill();
      g.beginPath(); g.arc(4.8, hy, 2.6, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.9)';
      g.beginPath(); g.arc(-3.9, hy - 1, 0.95, 0, TAU); g.fill();
      g.beginPath(); g.arc(5.7, hy - 1, 0.95, 0, TAU); g.fill();
    }
    if (sp.beak) {
      g.fillStyle = '#f0a03a';
      g.beginPath(); g.moveTo(-3.4, hy + 4); g.lineTo(3.4, hy + 4); g.lineTo(0, hy + 8); g.closePath(); g.fill();
    } else {
      g.fillStyle = 'rgba(120,80,50,0.8)';
      g.beginPath(); g.ellipse(0, hy + 4.4, 2.3, 1.7, 0, 0, TAU); g.fill();
      if (sp.ear !== 'frog') {
        g.strokeStyle = 'rgba(90,60,40,0.55)'; g.lineWidth = 1.2; g.lineCap = 'round';
        g.beginPath(); g.arc(0, hy + 6, 3.8, 0.35, Math.PI - 0.35); g.stroke();
      }
    }
  }
  g.fillStyle = 'rgba(240,140,120,0.28)';
  g.beginPath(); g.arc(-10.5, hy + 5.5, 3, 0, TAU); g.fill();
  g.beginPath(); g.arc(10.5, hy + 5.5, 3, 0, TAU); g.fill();

  if (ch.id === 'ceo') {
    g.fillStyle = '#8b2f2f';
    g.beginPath(); g.moveTo(0, bodyTop + 4); g.lineTo(4, bodyTop + 8); g.lineTo(0, bodyTop + 21); g.lineTo(-4, bodyTop + 8); g.closePath(); g.fill();
  }
  g.restore();
}

function drawSelection(g, ch, t) {
  const p = 1 + Math.sin(t * 3) * 0.05;
  g.save();
  g.strokeStyle = '#ffd79b'; g.globalAlpha = 0.9; g.lineWidth = 2.4;
  g.setLineDash([6, 5]); g.lineDashOffset = -t * 14;
  g.beginPath(); g.ellipse(ch.x, ch.y + 2, 24 * p, 9 * p, 0, 0, TAU); g.stroke();
  g.restore();
}

/* =========================================================
   8. 말풍선 · 이름표 (화면 좌표)
   ========================================================= */
function wrapText(g, text, maxW) {
  const out = []; let line = '';
  for (const c of Array.from(text)) {
    const test = line + c;
    if (g.measureText(test).width > maxW && line) { out.push(line); line = c; }
    else line = test;
  }
  if (line) out.push(line);
  return out.slice(0, 3);
}
function drawBubbles(g, t) {
  const placed = [];
  for (const ch of chars) {
    if (!ch.visible || !ch.bubble) continue;
    const left = ch.bubbleUntil - t;
    if (left <= 0) continue;
    const age = t - ch.bubbleStart;
    const alpha = Math.min(1, age / 0.22, left / 0.35);
    const p = project(ch.x, ch.y - 78);
    g.save();
    g.globalAlpha = alpha;
    g.font = fw(700, 10.5);
    const padX = 8, padY = 6, lh = 14;
    const lines = wrapText(g, ch.bubble, 118);
    let tw = 0;
    for (const l of lines) tw = Math.max(tw, g.measureText(l).width);
    const bw = Math.min(134, tw + padX * 2);
    const bh = lines.length * lh + padY * 2 - 2;
    let bx = clamp(p.x - bw / 2, 4, vw - bw - 4);
    let by = Math.max(4, p.y - bh - 10);

    g.fillStyle = 'rgba(255,251,244,0.97)';
    g.strokeStyle = 'rgba(60,40,20,0.18)'; g.lineWidth = 1;
    const tailX = clamp(p.x, bx + 12, bx + bw - 12);
    g.beginPath();
    g.moveTo(tailX - 5, by + bh - 1); g.lineTo(tailX + 1, by + bh + 7); g.lineTo(tailX + 5, by + bh - 1);
    g.closePath(); g.fill(); g.stroke();
    g.shadowColor = 'rgba(40,20,0,0.35)'; g.shadowBlur = 8; g.shadowOffsetY = 2;
    g.fillStyle = 'rgba(255,251,244,0.98)';
    rr(g, bx, by, bw, bh, 9); g.fill();
    g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.strokeStyle = 'rgba(60,40,20,0.10)'; rr(g, bx, by, bw, bh, 9); g.stroke();
    g.fillStyle = ch.color; g.fillRect(bx, by + 8, 2.5, bh - 16);
    g.fillStyle = '#3a2a1c';
    g.textBaseline = 'top';
    lines.forEach((l, i) => g.fillText(l, bx + padX + 3, by + padY + i * lh));
    g.restore();
    g.textBaseline = 'alphabetic';
  }
}
function drawBadges(g) {
  if (cam.zoom < 0.5) return;
  g.save();
  g.textAlign = 'center';
  for (const ch of chars) {
    if (!ch.visible) continue;
    const p = project(ch.x, ch.y + (ch.pose === 'seated' ? -16 : 6));

    g.font = fw(800, 9);

    const bx = p.x - bw / 2, by = p.y;
    if (bx > vw || bx + bw < 0 || by > vh || by + bh < 0) continue;
    const st = STATUS_META[ch.status] || STATUS_META.working;
    g.fillStyle = 'rgba(20,14,9,0.84)';
    rr(g, bx, by, bw, bh, 7); g.fill();
    g.strokeStyle = 'rgba(245,184,102,0.25)'; g.lineWidth = 1; rr(g, bx, by, bw, bh, 7); g.stroke();
    g.fillStyle = ch.color;
    g.beginPath(); g.arc(bx + 7, by + 7, 2.6, 0, TAU); g.fill();
    g.fillStyle = 'rgba(250,240,228,0.95)';
    g.textBaseline = 'middle';
    g.fillText(label, bx + bw / 2 + 2, by + 7.6);
    g.textBaseline = 'alphabetic';
  }
  g.restore();
  g.textAlign = 'left';
}

/* =========================================================
   9. 시뮬레이션 · 렌더 루프
   ========================================================= */
function stepChar(ch, dt) {
  if (!ch.path.length) { ch.moving = false; return; }
  const tg = ch.path[0];
  const dx = tg.x - ch.x, dy = tg.y - ch.y;
  const d = Math.hypot(dx, dy);
  const sp = 105 * dt;
  if (d < 3) {
    ch.x = tg.x; ch.y = tg.y; ch.path.shift();
    if (!ch.path.length) {
      ch.moving = false;
      ch.pose = (ch.action === 'working' || ch.action === 'idle') ? 'seated' : 'stand';
    }
  } else {
    ch.x += dx / d * Math.min(sp, d);
    ch.y += dy / d * Math.min(sp, d);
    ch.dir = dx > 0.5 ? 1 : (dx < -0.5 ? -1 : ch.dir);
    ch.walk += dt * 10;
    ch.moving = true;
    ch.pose = 'stand';
  }
}
function tickBubbles(t) {
  let active = 0;
  for (const ch of chars) { if (ch.bubble && t < ch.bubbleUntil) active++; }
  for (const ch of chars) {
    if (!ch.visible) continue;
    if (ch.bubble && t > ch.bubbleUntil) { ch.bubble = null; active--; }
    let near = false;
    for (const o of chars) {
      if (o === ch || !o.bubble || t > o.bubbleUntil) continue;
      if (Math.hypot(o.x - ch.x, o.y - ch.y) < 120) { near = true; break; }
    }
    if (!ch.bubble && !near && active < 4 && t > ch.nextBubble && ch.bubbles.length) {
      active++;
      ch.bubble = ch.bubbles[ch.bubbleIdx++ % ch.bubbles.length];
      ch.bubbleStart = t;
      ch.bubbleUntil = t + 4.8 + Math.random() * 2.2;
      ch.nextBubble = t + 10 + Math.random() * 13;
    }
  }
}
let lastT = 0;
function frame(now) {
  const t = now / 1000;
  const dt = Math.min(0.05, lastT ? t - lastT : 0.016);
  lastT = t;

  const k = 1 - Math.exp(-9 * dt);
  cam.x = lerp(cam.x, camT.x, k);
  cam.y = lerp(cam.y, camT.y, k);
  cam.zoom = lerp(cam.zoom, camT.zoom, k);

  for (const ch of chars) {
    if (!ch.visible) continue;
    if (!ch.started) {
      if (t >= ch.startAt) { ch.started = true; retarget(ch, true); }
      else continue;
    }
    const tg = targetFor(ch);
    const key = tg.key;
    if (ch.targetKey !== key) retarget(ch);
    ch.action = key;
    stepChar(ch, dt);
  }
  tickBubbles(t);

  const want = phaseMode === 'auto' ? autoPhase(new Date().getHours()) : phaseMode;
  phaseKey = want;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, vw, vh);
  ctx.fillStyle = '#0a0807'; ctx.fillRect(0, 0, vw, vh);

  ctx.save();
  ctx.translate(vw / 2, vh / 2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  const ph = PHASES[phaseKey];
  const im = IMG[ph.img];
  if (im) {
    ctx.drawImage(im, 0, 0, W, H);
  } else {
    // 이미지 로딩 전 임시 바닥
    ctx.fillStyle = '#5a4130'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    for (let y = 0; y < H; y += 64) ctx.fillRect(0, y, W, 2);
  }
  if (ph.tint !== 'rgba(255,255,255,0.00)') { ctx.fillStyle = ph.tint; ctx.fillRect(0, 0, W, H); }

  drawTVBoard(ctx, t);

  const sorted = chars.filter(c => c.visible).sort((a, b) => a.y - b.y);
  for (const ch of sorted) {
    if (ch.id === selectedId) drawSelection(ctx, ch, t);
    if (ch.status === 'off') ctx.globalAlpha = 0.55;
    drawChar(ctx, ch, t);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  drawBubbles(ctx, t);
  drawBadges(ctx);
  updateHud();
  requestAnimationFrame(frame);
}

/* =========================================================
   10. HUD · 패널
   ========================================================= */
const hudEl = document.getElementById('hud');
let hudKey = '';
function updateHud() {
  const c = { working: 0, meeting: 0, break: 0, idle: 0, off: 0 };
  chars.forEach(ch => { if (ch.visible && c[ch.status] !== undefined) c[ch.status]++; });
  const key = Object.values(c).join('/');
  if (key !== hudKey) {
    hudKey = key;
    hudEl.innerHTML =
      '<span><i style="background:#6ee7b7"></i>근무 ' + c.working + '</span>' +
      '<span><i style="background:#7dd3fc"></i>회의 ' + c.meeting + '</span>' +
      '<span><i style="background:#fbbf24"></i>휴식 ' + c.break + '</span>' +
      '<span><i style="background:#cbd5e1"></i>대기 ' + c.idle + '</span>' +
      '<span><i style="background:#94a3b8"></i>퇴근 ' + c.off + '</span>';
  }
}

function renderAll() { renderOffice(); renderTasks(); renderStaff(); renderLog(); }

function renderOffice() {
  const d = data || {};
  const el = document.getElementById('pane-office');
  const rows = ((d.board && d.board.rows) || []).map(r => {
    const col = r.tone === 'ok' ? '#6ee7b7' : r.tone === 'wait' ? '#fbbf24' : r.tone === 'info' ? '#7dd3fc' : '#c4b5fd';
    return '<div class="boardrow"><span class="lab">' + r.label + '</span><span class="val" style="color:' + col + '">' + r.value + (r.unit || '') + '</span></div>';
  }).join('');
  const doneTasks = ((d.tasks) || []).filter(x => x.state === 'done').slice(0, 3).map(x =>
    '<div class="task"><div class="ico" style="background:#12352b;color:#6ee7b7">✓</div>' +
    '<div style="min-width:0"><div class="tt">' + x.title + '</div><div class="tn">' + (x.note || '') + ' · ' + x.owner + '</div></div></div>').join('');
  el.innerHTML =
    '<div class="mini">' + ((d.office && d.office.greeting) || '오늘도 함께 일하고 있어요') + '</div>' +
    rows +
    '<div class="tick">● ' + ((d.board && d.board.ticker) || '') + '</div>' +
    '<div class="mini">최근 완료</div>' + (doneTasks || '<div class="empty">완료된 업무가 없습니다</div>') +
    '<div class="mini">데이터 ' + (localMode ? '내장' : 'status.json') + ' · 갱신 ' + (lastSync || '-') + '</div>';
}
function renderTasks() {
  const d = data || {};
  const el = document.getElementById('pane-tasks');
  const order = { progress: 0, waiting: 1, done: 2 };
  const list = ((d.tasks) || []).slice().sort((a, b) => (order[a.state] ?? 3) - (order[b.state] ?? 3));
  if (!list.length) { el.innerHTML = '<div class="empty">표시할 업무가 없습니다</div>'; return; }
  el.innerHTML = list.map(x => {
    const st = x.state === 'done' ? { c: '#6ee7b7', bg: '#12352b', t: '완료', ico: '✓' }
      : x.state === 'waiting' ? { c: '#94a3b8', bg: '#1e2430', t: '대기', ico: '⋯' }
      : { c: '#f5b866', bg: '#3a2a12', t: '진행 중', ico: '▸' };
    return '<div class="task">' +
      '<div class="ico" style="background:' + st.bg + ';color:' + st.c + '">' + st.ico + '</div>' +
      '<div style="min-width:0;flex:1">' +
        '<div class="tt">' + x.title + '</div>' +
        '<div class="bar"><i style="width:' + (x.progress || 0) + '%;background:' + st.c + '"></i></div>' +
        '<div class="tmeta"><span class="who">' + x.owner + '</span><span>·</span><span>' + st.t + '</span>' +
          (x.note ? '<span style="margin-left:auto">' + x.note + '</span>' : '') + '</div>' +
      '</div></div>';
  }).join('');
}
function renderStaff() {
  const el = document.getElementById('pane-staff');
  const list = chars.filter(c => c.visible).sort((a, b) => a.order - b.order);
  el.innerHTML = list.map(ch => {
    const st = STATUS_META[ch.status] || STATUS_META.working;
    return '<div class="srow' + (ch.id === selectedId ? ' sel' : '') + '" data-id="' + ch.id + '">' +
      '<span class="sav" style="background:' + ch.color + '22;border:1px solid ' + ch.color + '55">' +
        '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' + ch.color + '"></span></span>' +
      '<span style="min-width:0;flex:1"><span class="sname">' + ch.name + ' <span style="color:#8a7660;font-weight:700">· ' + ch.rank + '</span></span>' +
      '<span class="stask">' + (ch.task || '') + '</span></span>' +
      '<span class="badge" style="color:' + st.color + ';background:' + st.color + '18;border:1px solid ' + st.color + '44">' + st.label + '</span>' +
    '</div>';
  }).join('');
  el.querySelectorAll('.srow').forEach(row => {
    row.addEventListener('click', () => selectStaff(row.getAttribute('data-id'), true));
  });
}
function renderLog() {
  const el = document.getElementById('pane-log');
  if (!logs.length) { el.innerHTML = '<div class="empty">기록이 없습니다</div>'; return; }
  el.innerHTML = logs.slice(0, 40).map(l =>
    '<div class="lrow' + (l.live ? ' live' : '') + '">' +
      '<span class="t">' + (l.time || '') + '</span>' +
      '<span class="w">' + (l.who || '') + '</span>' +
      '<span class="x">' + (l.text || '') + '</span>' +
      (l.live ? '<span class="tag">LIVE</span>' : '') +
    '</div>').join('');
}
function selectStaff(id, focus) {
  selectedId = (selectedId === id) ? null : id;
  renderStaff();
  if (selectedId && focus) {
    const ch = chars.find(c => c.id === selectedId);
    if (ch) {
      camT.x = ch.x; camT.y = ch.y - 20;
      camT.zoom = Math.max(camT.zoom, 0.95);
      userZoomed = true;
      clampCam(camT);
    }
  }
  if (selectedId) switchTab('staff');
}
function switchTab(name) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.getAttribute('data-tab') === name));
  ['office', 'tasks', 'staff', 'log'].forEach(k => {
    document.getElementById('pane-' + k).hidden = k !== name;
  });
}

/* =========================================================
   11. UI 바인딩
   ========================================================= */
const phasesEl = document.getElementById('phases');
phasesEl.innerHTML = [['auto', '자동']].concat(PHASE_ORDER.map(k => [k, PHASES[k].label]))
  .map(([k, l]) => '<button data-ph="' + k + '"' + (k === 'auto' ? ' class="on"' : '') + '>' + l + '</button>').join('');
phasesEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  phaseMode = b.getAttribute('data-ph');
  phasesEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
});
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  switchTab(b.getAttribute('data-tab'));
});
document.getElementById('zin').addEventListener('click', () => zoomAt(1.3, vw / 2, vh / 2));
document.getElementById('zout').addEventListener('click', () => zoomAt(1 / 1.3, vw / 2, vh / 2));
document.getElementById('zfit').addEventListener('click', fitAll);

function tickClock() {
  const d = new Date();
  const ph = PHASES[phaseMode === 'auto' ? autoPhase(d.getHours()) : phaseMode];
  document.getElementById('clock').textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ' · ' + ph.label;
  document.getElementById('clock').style.color = ph.css;
}
setInterval(tickClock, 5000);
tickClock();

/* 포인터 */
const pointers = new Map();
let dragMoved = false, downTime = 0, pinchStart = 0, pinchZoom0 = 1;
function cpos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, cpos(e));
  dragMoved = false; downTime = performance.now();
  if (pointers.size === 2) {
    const [a, b] = Array.from(pointers.values());
    pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
    pinchZoom0 = cam.zoom;
  }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId), p = cpos(e);
  pointers.set(e.pointerId, p);
  if (pointers.size === 2) {
    const [a, b] = Array.from(pointers.values());
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchStart > 10) {
      const z = clamp(pinchZoom0 * (d / pinchStart), fitZoom() * 0.9, 2.6);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const wx = (mx - vw / 2) / cam.zoom + cam.x, wy = (my - vh / 2) / cam.zoom + cam.y;
      cam.zoom = z; camT.zoom = z;
      cam.x = wx - (mx - vw / 2) / z; cam.y = wy - (my - vh / 2) / z;
      camT.x = cam.x; camT.y = cam.y; userZoomed = true;
      clampCam(camT); cam.x = camT.x; cam.y = camT.y;
    }
    dragMoved = true;
    return;
  }
  const dx = p.x - prev.x, dy = p.y - prev.y;
  if (Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
  if (dragMoved) {
    cam.x -= dx / cam.zoom; cam.y -= dy / cam.zoom;
    camT.x = cam.x; camT.y = cam.y;
    clampCam(camT); cam.x = camT.x; cam.y = camT.y;
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size === 0 && !dragMoved && performance.now() - downTime < 620) {
    const wx = (p.x - vw / 2) / cam.zoom + cam.x;
    const wy = (p.y - vh / 2) / cam.zoom + cam.y;
    let best = null, bd = 34;
    for (const ch of chars) {
      if (!ch.visible) continue;
      const d = Math.hypot(wx - ch.x, wy - (ch.y - 30));
      if (d < bd) { bd = d; best = ch; }
    }
    if (best) selectStaff(best.id, false);
    else if (selectedId) { selectedId = null; renderStaff(); }
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e => pointers.delete(e.pointerId));
cv.addEventListener('wheel', e => { e.preventDefault(); const p = cpos(e); zoomAt(e.deltaY > 0 ? 0.9 : 1.1, p.x, p.y); }, { passive: false });

/* =========================================================
   12. 데이터
   ========================================================= */
function fallbackData() {
  try { return JSON.parse(document.getElementById('fallback-status').textContent); } catch (e) { return null; }
}
async function loadStatus(first) {
  const fb = fallbackData();
  try {
    const res = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    lastRaw = txt;
    const d = JSON.parse(txt);
    localMode = false;
    applyStatus(d);
  } catch (e) {
    localMode = true;
    if (first && fb) applyStatus(fb);
  }
  if (first) chars.forEach((ch, i) => { ch.startAt = 0.9 + i * 0.22; });
}
async function poll() {
  try {
    const res = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const txt = await res.text();
    if (txt === lastRaw) return;
    lastRaw = txt;
    const d = JSON.parse(txt);
    if (applyStatus(d)) pushLog('해이', 'status.json 갱신 반영', 'live');
  } catch (e) {}
}

/* =========================================================
   13. 시작
   ========================================================= */
function boot() {
  buildGrid();
  loadImages();
  const fb = fallbackData();
  if (fb) applyStatus(fb);
  resize();
  renderAll();
  loadStatus(true).then(() => { resize(); renderAll(); });
  requestAnimationFrame(frame);
  setInterval(poll, 20000);
}
window.AI_OFFICE = {
  setStatus: d => applyStatus(d),
  chars: () => chars.map(c => ({ id: c.id, name: c.name, status: c.status, x: Math.round(c.x), y: Math.round(c.y), pose: c.pose, moving: c.moving })),
  phase: () => phaseKey,
  zoom: () => cam.zoom
};
boot();
})();
</script>
