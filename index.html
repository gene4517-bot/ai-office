<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#15120f" />
<meta name="description" content="1인 기업 AI 지휘실 · 실사 오피스에서 19명(대표 + AI 직원 + 전문 자문단)이 살아 움직이는 라이브 대시보드" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96.png" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AI 지휘실" />
<meta name="application-name" content="AI 지휘실" />
<title>AI 지휘실</title>
<style>
  :root{
    --bg:#0b0908; --panel:#15110d; --card:#1d1711; --card2:#231c15; --line:#33281d;
    --ink:#f6efe4; --dim:#bda98f; --dim2:#8a7660;
    --gold:#f5b866; --ok:#6ee7b7; --meet:#7dd3fc; --brk:#fbbf24; --idle:#cbd5e1; --off:#94a3b8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased}
  body{overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;min-height:0}
  #body{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}

  /* ---------- top bar ---------- */
  #topbar{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 11px;
    background:linear-gradient(180deg,#1b1510,#120e0a);border-bottom:1px solid var(--line);z-index:6}
  .brand{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
  .logo{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;flex:0 0 auto;
    background:linear-gradient(150deg,#f7c884,#e08b4c);color:#3a2410;font-weight:900;box-shadow:0 2px 8px rgba(224,139,76,.35)}
  .brand b{display:block;font-size:13px;letter-spacing:-.3px;white-space:nowrap;line-height:1.2}
  .brand small{display:block;font-size:10px;color:var(--dim2);font-variant-numeric:tabular-nums;letter-spacing:.2px}
  #phases{margin-left:auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0;flex:0 1 auto;min-width:0}
  #phases::-webkit-scrollbar{display:none}
  #phases button{flex:0 0 auto;font:700 11px/1 inherit;color:var(--dim);background:#1a140f;border:1px solid #33281d;
    padding:6px 9px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:.15s}
  #phases button.on{color:#2a1a08;background:linear-gradient(160deg,#ffd79b,#f0b064);border-color:#ffd79b;
    box-shadow:0 2px 10px rgba(240,176,100,.25)}

  /* ---------- stage ---------- */
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#1a1410 0%,#0a0807 100%)}
  #cv{display:block;width:100%;height:100%;touch-action:none}
  .hud{position:absolute;left:8px;top:8px;display:flex;gap:3px;flex-wrap:nowrap;max-width:calc(100% - 56px);pointer-events:none;overflow:hidden}
  .hud span{font:700 9px/1 inherit;padding:3.5px 5px;border-radius:7px;background:rgba(20,15,11,.72);
    border:1px solid rgba(245,184,102,.14);color:#cbb79c;backdrop-filter:blur(6px);white-space:nowrap}
  .hud span i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:3px;vertical-align:middle}
  .zoomctl{position:absolute;right:9px;bottom:9px;display:flex;flex-direction:column;gap:6px;z-index:4}
  .zoomctl button{width:34px;height:34px;border-radius:10px;background:rgba(26,20,15,.86);border:1px solid var(--line);
    color:var(--ink);font-size:15px;line-height:1;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
  .zoomctl button:active{background:#2a2117}
  .zoomctl .fit{font-size:11px;font-weight:800;letter-spacing:-.4px}

  /* ---------- panel ---------- */
  #panel{flex:0 0 auto;max-height:48vh;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);z-index:5}
  .phead{flex:0 0 auto;padding:9px 12px 8px;border-bottom:1px solid var(--line)}
  .prow{display:flex;align-items:center;gap:9px}
  .prow .av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:12px;
    color:#2a1a08;background:linear-gradient(145deg,#ffd79b,#e59a52);flex:0 0 auto;box-shadow:inset 0 -8px 14px rgba(0,0,0,.14)}
  .pname{font-size:13.5px;font-weight:800;line-height:1.2}
  .psub{font-size:10.5px;color:var(--dim);margin-top:2px}
  .live{display:flex;align-items:center;gap:4px;margin-left:auto;font:800 9.5px/1 inherit;color:#0f1a12;
    background:#6ee7b7;padding:5px 7px;border-radius:999px;flex:0 0 auto}
  .live i{width:5px;height:5px;border-radius:50%;background:#0f1a12;animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .stats{display:flex;gap:5px;margin-top:8px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 7px}
  .stat b{display:block;font-size:15px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
  .stat span{font-size:9.5px;color:var(--dim2)}

  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px 9px 0;flex:0 0 auto}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{min-width:0;padding:7px 4px;border-radius:9px;background:#17120d;border:1px solid #2a2118;
    color:var(--dim);font:700 10.5px/1 inherit;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs button.on{background:var(--card);border-color:var(--line);color:var(--ink)}  .pane{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);
    border-top:1px solid var(--line);padding:9px 10px calc(14px + env(safe-area-inset-bottom))}
  .pane[hidden]{display:none}

  .boardrow{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:10px;background:var(--card2);
    border:1px solid var(--line);margin-bottom:6px}
  .boardrow .lab{font-size:11px;color:var(--dim)}
  .boardrow .val{margin-left:auto;font-size:15px;font-weight:800;letter-spacing:-.4px}
  .mini{font-size:10px;color:var(--dim2);margin:8px 2px 6px;font-weight:700}
  .tick{font-size:10.5px;color:#9fd8c6;background:#122a24;border:1px solid #1e4038;border-radius:8px;padding:7px 9px;line-height:1.5}

  .task{display:flex;gap:9px;padding:9px;border-radius:10px;background:var(--card2);border:1px solid var(--line);margin-bottom:7px}
  .task .ico{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:11px;flex:0 0 auto;font-weight:900}
  .task .tt{font-size:11.5px;font-weight:800;line-height:1.35}
  .task .tn{font-size:10px;color:var(--dim);margin-top:3px}
  .bar{height:4px;border-radius:2px;background:#120e0a;margin-top:7px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:2px}
  .tmeta{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:9.5px;color:var(--dim2)}
  .tmeta .who{color:#e6d3b8}

  .srow{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;background:var(--card2);
    border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
  .dhead{display:flex;align-items:center;gap:6px;margin:10px 2px 6px;font:800 10px/1 inherit;color:#e6d3b8;letter-spacing:.2px}
  .dhead:first-child{margin-top:2px}
  .dhead i{width:6px;height:6px;border-radius:50%;display:inline-block}
  .dhead span{margin-left:auto;font:700 9.5px/1 inherit;color:var(--dim2)}
  .deptsum{display:flex;gap:5px;margin:2px 0 8px}
  .deptsum span{flex:1;text-align:center;font:700 9.5px/1.5 inherit;color:#cbb79c;background:var(--card2);
    border:1px solid var(--line);border-radius:8px;padding:5px 3px}
  .deptsum span b{display:block;font:800 11px/1 inherit;color:#f6efe4;margin-bottom:2px}
  .srow.sel{border-color:#f5b866;box-shadow:0 0 0 1px rgba(245,184,102,.35) inset}
  .sav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
  .sname{display:block;font-size:11.5px;font-weight:800;line-height:1.25}
  .stask{display:block;font-size:9.5px;color:var(--dim2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
  .badge{margin-left:auto;font:800 9px/1 inherit;padding:4px 6px;border-radius:999px;flex:0 0 auto;white-space:nowrap}

  .lrow{display:flex;gap:8px;padding:8px 3px;border-bottom:1px dashed rgba(245,184,102,.10);font-size:11px;line-height:1.4}
  .lrow .t{color:var(--dim2);font-variant-numeric:tabular-nums;flex:0 0 auto;font-size:10px;padding-top:1px}
  .lrow .w{font-weight:800;flex:0 0 auto;color:#f0d7b4}
  .lrow .x{color:#b9a68e;min-width:0}
  .lrow.live .w{color:#7ff0d8}
  .lrow .tag{font:800 8.5px/1 inherit;color:#0b1a18;background:#6ee7b7;padding:2px 4px;border-radius:4px;margin-left:auto;flex:0 0 auto;align-self:center}
  .empty{color:var(--dim2);font-size:11px;padding:18px 2px;text-align:center}

  /* ---------- 음성 지휘 ---------- */
  .vwrap{display:flex;flex-direction:column;gap:9px}
  .vmic{width:86px;height:86px;border-radius:50%;margin:6px auto 2px;display:grid;place-items:center;
    font-size:30px;border:0;cursor:pointer;color:#2a1a08;
    background:radial-gradient(circle at 34% 30%,#ffe6bc,#f0b064 62%,#d98b3f);
    box-shadow:0 8px 22px rgba(240,176,100,.28), inset 0 -6px 14px rgba(160,90,30,.22);transition:.18s}
  .vmic:active{transform:scale(.96)}
  .vmic.on{box-shadow:0 0 0 0 rgba(245,184,102,.55);animation:vmicro 1.5s infinite}
  @keyframes vmicro{0%{box-shadow:0 0 0 0 rgba(245,184,102,.5)}70%{box-shadow:0 0 0 20px rgba(245,184,102,0)}100%{box-shadow:0 0 0 0 rgba(245,184,102,0)}}
  .vstate{text-align:center;font:700 10.5px/1.4 inherit;color:var(--dim)}
  .vstate.live{color:#7ff0d8}
  #vtext{width:100%;min-height:52px;resize:vertical;border-radius:10px;border:1px solid var(--line);
    background:#120e0a;color:var(--ink);padding:9px 10px;font:600 12px/1.45 inherit}
  #vtext::placeholder{color:#7b6a58}
  .vchips{display:flex;flex-wrap:wrap;gap:5px}
  .vchips button{font:700 10px/1 inherit;color:#e6d3b8;background:#1c1710;border:1px solid #3a2f22;
    padding:6px 8px;border-radius:999px;cursor:pointer}
  .vchips button:active{background:#2a2117}
  .vgo{width:100%;padding:11px;border-radius:11px;border:0;cursor:pointer;
    font:800 12.5px/1 inherit;color:#2a1a08;background:linear-gradient(160deg,#ffd79b,#f0b064)}
  .vgo:active{filter:brightness(.95)}
  .vcard{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-top:2px}
  .vwho{display:flex;align-items:center;gap:6px;font:800 11.5px/1.2 inherit}
  .vwho i{width:7px;height:7px;border-radius:50%}
  .vwho span{font:700 9.5px/1 inherit;color:var(--dim2);margin-left:2px}
  .vwhy{font:600 10.5px/1.5 inherit;color:var(--dim);margin-top:5px}
  .vprompt{margin-top:7px;font:600 10px/1.55 ui-monospace,SFMono-Regular,Menlo,'Noto Sans KR',monospace;
    color:#b9d7cf;background:#101a18;border:1px solid #1e3a34;border-radius:8px;padding:7px 8px;
    white-space:pre-wrap;max-height:118px;overflow:auto}
  .vacts{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .vacts button{flex:1 1 auto;font:800 10.5px/1 inherit;padding:8px 9px;border-radius:9px;cursor:pointer;
    color:#0f1a12;background:#6ee7b7;border:0}
  .vacts button.ghost{color:#e6d3b8;background:#241d15;border:1px solid #3a2f22}
  .vacts button:disabled{opacity:.5;cursor:default}
  .vmsg{font:700 10.5px/1.4 inherit;color:#ffd79b;margin-top:6px}
  .vshot{margin-top:7px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .vshot img{display:block;width:100%}
  .vrow{display:flex;gap:7px;align-items:flex-start;padding:7px 3px;border-bottom:1px dashed rgba(245,184,102,.10);font-size:10.5px;line-height:1.4}
  .vrow .t{color:var(--dim2);flex:0 0 auto;font-variant-numeric:tabular-nums;padding-top:1px}
  .vrow .w{font-weight:800;color:#f0d7b4;flex:0 0 auto}
  .vrow .x{color:#b9a68e;min-width:0}

  /* ---------- 전문 자문단 · 도구 · 스케줄 ---------- */
  .advtabs{display:flex;gap:4px;margin:0 0 8px}
  .advtabs button{flex:1;font:700 10.5px/1 inherit;padding:8px 5px;border-radius:9px;background:#1a140f;color:var(--dim);
    border:1px solid var(--line);cursor:pointer;white-space:nowrap}
  .advtabs button.on{color:#2a1a08;background:linear-gradient(160deg,#ffd79b,#f0b064);border-color:#ffd79b}
  .advcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
  .advtop{display:flex;align-items:center;gap:8px}
  .advico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:0 0 auto;
    background:#241c14;border:1px solid #3a2f22}
  .advtop b{display:block;font-size:12px;font-weight:800;line-height:1.2}
  .advtop small{display:block;font-size:9.5px;color:var(--dim2);margin-top:2px}
  .advline{margin-top:8px;font:700 10.5px/1.45 inherit;color:#ffe0b0;background:#2a1f12;
    border:1px solid #46341c;border-radius:8px;padding:7px 9px}
  .advrow{display:flex;gap:7px;padding:7px 2px;border-bottom:1px dashed rgba(245,184,102,.10);font-size:10.5px;line-height:1.4}
  .advrow:last-child{border-bottom:0}
  .advrow .ic{flex:0 0 auto;font-size:10px;padding-top:1px;width:12px;text-align:center}
  .advrow .bd{flex:1 1 auto;min-width:0}
  .advrow .tx{color:#e6d3b8;font-weight:700;display:block}
  .advrow .nt{color:var(--dim2);font-size:9.5px;margin-top:2px;line-height:1.35;display:block}
  .advrow .vv{margin-left:auto;font:800 11.5px/1 inherit;color:#f6efe4;white-space:nowrap}
  .advacts{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
  .advacts button{flex:1 1 auto;font:800 10px/1 inherit;padding:8px 6px;border-radius:9px;border:0;cursor:pointer;
    color:#0f1a12;background:#6ee7b7;white-space:nowrap}
  .advacts button.ghost{color:#e6d3b8;background:#241d15;border:1px solid #3a2f22}
  .toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .tool{display:flex;gap:7px;align-items:flex-start;padding:8px;border-radius:10px;background:var(--card2);
    border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
  .tool:active{background:#2a2117}
  .tool .ti{font-size:15px;line-height:1.05;flex:0 0 auto}
  .tool b{display:block;font-size:10.5px;font-weight:800;color:#f6efe4;line-height:1.25}
  .tool small{display:block;font-size:9px;color:var(--dim2);margin-top:2px;line-height:1.3}
  .toolchips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin:0 0 8px}
  .toolchips::-webkit-scrollbar{display:none}
  .toolchips button{flex:0 0 auto;font:700 10px/1 inherit;color:#e6d3b8;background:#1c1710;border:1px solid #3a2f22;
    padding:7px 9px;border-radius:999px;cursor:pointer}
  .sched{display:flex;gap:7px;align-items:center;padding:7px 8px;border-radius:9px;background:var(--card2);
    border:1px solid var(--line);margin-bottom:5px;font-size:10px}
  .sched .si{font-size:12px;flex:0 0 auto}
  .sched b{font-weight:800;color:#e6d3b8;display:block;font-size:10.5px}
  .sched small{color:var(--dim2);font-size:9px;display:block;margin-top:1px}
  .sched .st{margin-left:auto;font:800 8.5px/1 inherit;padding:3px 5px;border-radius:999px;white-space:nowrap}
  .loop{display:flex;gap:4px;margin:6px 0 10px}
  .loop div{flex:1;text-align:center;font:700 9px/1.35 inherit;color:#cbb79c;background:#1b1610;
    border:1px solid var(--line);border-radius:8px;padding:7px 4px}
  .loop div b{display:block;font-size:12px;margin-bottom:3px}
  .stat2{display:flex;gap:5px;margin-bottom:8px}
  .stat2 span{flex:1;font:700 9px/1.4 inherit;color:#cbb79c;background:#1b1610;border:1px solid var(--line);
    border-radius:8px;padding:6px 4px;text-align:center}
  .stat2 span b{display:block;font:800 10.5px/1.2 inherit;color:#f6efe4}

  /* 전체 화면(사진만 크게) 모드: ?full=1 */
  body.full #topbar, body.full #panel{display:none}
  body.full #stage{flex:1 1 100vh}
  body.full .zoomctl{display:none}
  @media (min-width:900px) and (min-aspect-ratio:1/1){
    #body{flex-direction:row}
    #panel{width:410px;max-height:none;height:auto;border-top:0;border-left:1px solid var(--line)}
    .brand b{font-size:14px}
    .hud span{font-size:10.5px;padding:5px 7px}
    .stask{max-width:250px}
  }
  @media (max-height:640px){ .phead{padding:6px 10px 6px} .stat b{font-size:13.5px} .stats{margin-top:5px} }

  /* ---------- 📺 세계 무료 TV · 원터치 간편모드 ---------- */
  .tvbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font:800 10.5px/1 inherit;color:#20150a;
    background:linear-gradient(150deg,#ffe0a8,#f0a24c);border:1px solid #ffd79b;padding:7px 9px;border-radius:999px;
    cursor:pointer;white-space:nowrap;box-shadow:0 2px 10px rgba(240,162,76,.3)}
  .tvbtn:active{transform:scale(.96)}
  .tvbtn b{font-weight:900}
  @media (max-width:470px){ .tvbtn .tvtx{display:none} }
  #tvModal{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:#0a0807}
  #tvModal[hidden]{display:none}
  .tvHead{flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 11px 8px;background:linear-gradient(180deg,#1b1510,#120e0a);
    border-bottom:1px solid var(--line)}
  .tvHead .tvtt{min-width:0}
  .tvHead .tvtt b{display:block;font-size:13px;letter-spacing:-.3px;white-space:nowrap}
  .tvHead .tvtt small{display:block;font-size:9.5px;color:var(--dim2);margin-top:2px}
  .tvHead .tvsp{flex:1 1 auto}
  .tvHead button{flex:0 0 auto;font:800 10.5px/1 inherit;padding:8px 10px;border-radius:9px;background:#241c14;
    border:1px solid #3a2d20;color:#f6efe4;cursor:pointer;white-space:nowrap}
  .tvHead button.pri{background:linear-gradient(150deg,#ffe0a8,#f0a24c);color:#20150a;border-color:#ffd79b}
  .tvChips{flex:0 0 auto;display:flex;gap:5px;overflow-x:auto;padding:7px 9px;background:#120e0a;
    border-bottom:1px solid var(--line);scrollbar-width:none}
  .tvChips::-webkit-scrollbar{display:none}
  .tvChips button{flex:0 0 auto;font:700 10.5px/1 inherit;color:#d8c7ae;background:#1a140f;border:1px solid #33281d;
    padding:7px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tvChips button b{font:800 9px/1 inherit;color:#8a7660;margin-left:2px}
  .tvChips button.on{color:#2a1a08;background:linear-gradient(160deg,#ffd79b,#f0b064);border-color:#ffd79b}
  .tvChips button.on b{color:#6b4a1c}
  .tvFrame{position:relative;flex:1 1 auto;min-height:0;background:#000}
  .tvFrame iframe{width:100%;height:100%;border:0;display:block;background:#000}
  .tvFall{position:absolute;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));

/* GIF 촬영용 결정론적 루프: 모든 움직임을 한 주기(P)에 맞춰 끊김 없이 반복 */

function planLoopBubbles(P) {
  const pick = ['ceo', 'haei', 'buddy', 'muse', 'claude', 'rua'];
  const wins = [[0.55, 2.75], [1.85, 4.05], [3.25, 5.25]];
  const plan = {};

    if (!ch || !ch.bubbles.length) return;
    plan[id] = { t0: wins[k][0], t1: Math.min(wins[k][1], P - 0.45), text: ch.bubbles[0] };

    if (t >= w.t0 && t <= w.t1) {

const cv = document.getElementById('cv');

const fitZoom = () => Math.min(vw / (W + 20), vh / (H + 20));

  const hw = vw / 2 / t.zoom, hh = vh / 2 / t.zoom;
  if (hw * 2 >= W) t.x = W / 2; else t.x = clamp(t.x, hw, W - hw);
  if (hh * 2 >= H) t.y = H / 2; else t.y = clamp(t.y, hh, H - hh);

function resize() {

function project(wx, wy) {
  return {
    x: (wx - (cam.x + camDrift.x)) * cam.zoom * camDrift.z + vw / 2,
    y: (wy - (cam.y + camDrift.y)) * cam.zoom * camDrift.z + vh / 2
  };
}
function zoomAt(factor, sx, sy) {
  const wx = (sx - vw / 2) / cam.zoom + cam.x;
  const wy = (sy - vh / 2) / cam.zoom + cam.y;
  const nz = clamp(cam.zoom * factor, fitZoom() * 0.9, 3.0);
  cam.zoom = nz;
  cam.x = wx - (sx - vw / 2) / nz;
  cam.y = wy - (sy - vh / 2) / nz;
  camT.zoom = nz; userZoomed = true;
  camT.x = cam.x; camT.y = cam.y;
  clampCam(camT); cam.x = camT.x; cam.y = camT.y;
}

const STATUS_META = {

function makeChar(s) {
  const seat = SEATS[s.id] || { ax: 620, ay: 700, lx: 620, ly: 660 };
  const ch = {
    id: s.id, seat,
    x: seat.ax, y: seat.ay, lx: seat.lx, ly: seat.ly,
    tx: seat.ax, ty: seat.ay, tlx: seat.lx, tly: seat.ly,
    seed: (hash(s.id) % 100) / 10,
    pose: 'seated', action: 'seated', status: 'working', targetKey: '',
    bubble: null, bubbleStart: 0, bubbleUntil: 0, bubbleIdx: hash(s.id) % 3, nextBubble: 0,
    startAt: 0, visible: true, order: 0,
    name: s.name, short: s.short || s.name, rank: s.rank || '', role: s.role || '',
    dept: s.dept || '',
    task: s.task || '', done: s.done, color: s.color || '#f5b866',
    species: s.species || 'bear', bubbles: s.bubbles || [],
    box: null, alpha: 0
  };

}
function updateChar(ch, s) {
  const prev = ch.status;
  ch.name = s.name || ch.name;
  ch.short = s.short || s.name;
  ch.rank = s.rank || '';
  ch.role = s.role || '';
  ch.dept = (s.dept === undefined ? ch.dept : s.dept) || '';
  ch.task = s.task || '';
  ch.done = (s.done === undefined ? null : s.done);
  ch.color = s.color || ch.color;
  ch.species = s.species || ch.species;
  ch.bubbles = Array.isArray(s.bubbles) ? s.bubbles : ch.bubbles;
  ch.status = STATUS_META[s.status] ? s.status : 'working';
  return prev !== ch.status;
}
function targetFor(ch) {
  const st = ch.status;
  if (st === 'meeting' && DOCKS.meeting.length) {
    const mates = chars.filter(c => c.visible && c.status === 'meeting').sort((a, b) => a.order - b.order);
    const i = Math.max(0, mates.indexOf(ch)) % DOCKS.meeting.length;
    return DOCKS.meeting[i];
  }
  if (st === 'break') return DOCKS.break[hash(ch.id) % DOCKS.break.length];
  if (st === 'off') return DOCKS.off[hash(ch.id) % DOCKS.off.length];
  return ch.seat;
}
function retarget(ch) {
  const t = targetFor(ch);
  ch.tx = t.ax; ch.ty = t.ay; ch.tlx = t.lx; ch.tly = t.ly;
}
function applyStatus(d) {
  if (!d || !Array.isArray(d.staff)) return false;
  data = d;
  const seen = {};
  d.staff.forEach((s, i) => {
    let ch = chars.find(c => c.id === s.id);
    if (!ch) { ch = makeChar(s); chars.push(ch); }
    const changed = updateChar(ch, s);
    ch.visible = true; ch.order = i; seen[s.id] = true;
    if (changed) retarget(ch);
  });
  chars.forEach(c => { if (!seen[c.id]) c.visible = false; });
  if (d.logs) logs = d.logs.map(l => ({ time: l.time || '', who: l.who || '', text: l.text || '', tone: l.tone || '', live: false }));

let uiScale = 1;
function tagMetrics(ch, zoom) {
  const u = uiScale;
  const withRank = (zoom >= 0.62 || ch.id === 'ceo') && !!ch.rank;
  const two = !!ch.task && zoom >= 1.05;
  const fName = 10.5 * u, fRank = 8.5 * u, fTask = 9 * u;
  ctx.save();
  ctx.font = fw(800, fName);
  let w = ctx.measureText(ch.short).width + 22 * u;
  if (withRank) { ctx.font = fw(700, fRank); w += ctx.measureText(' · ' + ch.rank).width + 1; }
  if (two) { ctx.font = fw(600, fTask); w = Math.max(w, Math.min(188 * u, ctx.measureText(ch.task).width + 20 * u)); }
  ctx.restore();
  return { w: Math.round(Math.min(198 * u, Math.max(w, 44 * u))), h: Math.round((two ? 33 : 17) * u), two, withRank, fName, fRank, fTask, u };
}

/* 이름표 자리 계산: 화면 좌표에서 겹치면 아래로 밀어 서로 가리지 않게 */
function layoutTags() {
  const placed = [];
  // 다른 직원의 자리 표시(점)를 먼저 장애물로 넣어, 이름표가 남의 자리를 덮지 않게
  for (const o of chars) {
    if (!o.visible || o.alpha <= 0.02) continue;
    const ap = project(o.x, o.y);
    placed.push({ x: ap.x - 5, y: ap.y - 5, w: 10, h: 10, anchor: true });
  }
  const cap = vw < 520 ? 9 : (vw < 780 ? 12 : 40);
  let shown = 0;
  const list = chars.filter(c => c.visible && c.alpha > 0.02)
    .sort((a, b) => (b.id === selectedId) - (a.id === selectedId) || a.order - b.order);
  for (const ch of list) {
    const m = tagMetrics(ch, cam.zoom);
    const lp = project(ch.lx, ch.ly);
    let x = clamp(lp.x - m.w / 2, 4, Math.max(4, vw - m.w - 4));
    let y = lp.y - m.h / 2;
    const baseY = y;
    for (let it = 0; it < 8; it++) {
      let hit = null;
      for (const p of placed) {
        if (x < p.x + p.w + 3 && p.x < x + m.w + 3 && y < p.y + p.h + 2 && p.y < y + m.h + 2) { hit = p; break; }
      }
      if (!hit) break;
      y = hit.y + hit.h + 3;
    }
    y = clamp(y, 4, Math.max(4, vh - m.h - 4));
    // 자리에서 너무 밀려나면(좁은 화면) 그리지 않는다 — 이름표가 자리를 잃는 것보다 낫다
    const maxPush = vw < 780 ? 30 : 72;
    if ((y - baseY > maxPush || shown >= cap) && ch.id !== selectedId) { ch.box = null; ch.m = null; continue; }
    shown++;
    placed.push({ x, y, w: m.w, h: m.h });
    if (ch.layX === undefined) { ch.layX = x; ch.layY = y; }
    else { ch.layX = lerp(ch.layX, x, 0.5); ch.layY = lerp(ch.layY, y, 0.5); }
    ch.m = m;
  }
}

function drawTag(g, ch, t) {
  const m = ch.m;
  if (!m) { ch.box = null; return; }
  const st = STATUS_META[ch.status] || STATUS_META.working;
  const sel = ch.id === selectedId;
  const a = ch.alpha * (ch.status === 'off' ? 0.5 : 1);
  if (a <= 0.02) { ch.box = null; return; }
  const bob = Math.sin(t * wf(1.15, 1) + ch.seed * 1.6) * 1.4 * m.u;
  const x = ch.layX;
  const y = ch.layY + bob;
  const u = m.u;

  g.save();
  g.globalAlpha = a;

  /* 리더선 + 자리 표시 */
  const ap = project(ch.x, ch.y);
  const ax = ap.x, ay = ap.y;
  const below = ay > y + m.h / 2;
  const sy = below ? y + m.h : y;
  const sx = clamp(ax, x + 10 * u, x + m.w - 10 * u);
  if (Math.hypot(ax - sx, ay - sy) > 16) {
    g.strokeStyle = 'rgba(255,247,235,0.28)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(sx, sy); g.lineTo(ax, ay); g.stroke();
  }
  const ringA = 0.5 + 0.5 * Math.sin(t * wf(2.1, 2) + ch.seed * 2.4);
  g.globalAlpha = a * (0.26 + 0.30 * ringA);
  g.strokeStyle = st.color;
  g.lineWidth = 1.3;
  g.beginPath(); g.arc(ax, ay, (6.2 + ringA * 1.5) * u, 0, TAU); g.stroke();
  g.globalAlpha = a * 0.92;
  g.fillStyle = st.color;
  g.beginPath(); g.arc(ax, ay, 2.1 * u, 0, TAU); g.fill();

  /* 카드 */
  g.globalAlpha = a;
  g.shadowColor = 'rgba(0,0,0,0.45)';
  g.shadowBlur = 9;
  g.shadowOffsetY = 2;
  const grd = g.createLinearGradient(x, y, x, y + m.h);
  grd.addColorStop(0, 'rgba(24,26,31,0.82)');
  grd.addColorStop(1, 'rgba(11,12,16,0.88)');
  g.fillStyle = grd;
  rr(g, x, y, m.w, m.h, 6.5 * u); g.fill();
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.strokeStyle = sel ? 'rgba(255,215,155,0.95)' : 'rgba(255,244,228,0.19)';
  g.lineWidth = sel ? 1.5 : 1;
  rr(g, x, y, m.w, m.h, 6.5 * u); g.stroke();
  /* 왼쪽 상태 점 */
  const dy0 = y + (m.two ? 10 * u : m.h / 2);
  g.fillStyle = st.color;
  g.beginPath(); g.arc(x + 8.5 * u, dy0, 2.4 * u, 0, TAU); g.fill();
  g.globalAlpha = a * 0.28;
  g.beginPath(); g.arc(x + 8.5 * u, dy0, 4.8 * u, 0, TAU); g.fill();
  g.globalAlpha = a;
  /* 이름 + 직급 */
  const ty = m.two ? y + 10 * u : y + m.h / 2 + 0.3 * u;
  g.textBaseline = 'middle';
  g.textAlign = 'left';
  g.font = fw(800, m.fName);
  const nameW = g.measureText(ch.short).width;
  g.fillStyle = '#fbf6ee';
  g.fillText(ch.short, x + 14 * u, ty + 0.4 * u);
  if (m.withRank) {
    g.font = fw(700, m.fRank);
    g.fillStyle = 'rgba(212,197,176,0.92)';
    g.fillText(' · ' + ch.rank, x + 14 * u + nameW, ty + 0.6 * u);
  }
  /* 두 번째 줄: 현재 업무 */
  if (m.two) {
    g.font = fw(600, m.fTask);
    g.fillStyle = 'rgba(190,205,215,0.82)';
    g.fillText(cutText(g, ch.task, m.w - 17 * u), x + 14 * u, y + 23.5 * u);
  }

  g.textBaseline = 'alphabetic';

  ch.box = { x, y, w: m.w, h: m.h };
}
function cutText(g, text, maxW) {
  if (g.measureText(text).width <= maxW) return text;
  let out = '';
  for (const c of Array.from(text)) {
    if (g.measureText(out + c + '…').width > maxW) break;
    out += c;
  }
  return out + '…';
}

const MOTION_GAIN = 1.0;       // 몸 움직임 세기 (고개는 HEADS 쪽에서 더 크게)
function actorPose(A, t) {
  const p = A.ph * TAU;
  const ang = MOTION_GAIN * A.sway * (0.62 * Math.sin(t * TAU * F0 + p) + 0.38 * Math.sin(t * TAU * F1 + p * 1.7));
  const dy = MOTION_GAIN * A.bob * Math.sin(t * TAU * F1 + p * 1.3);
  const sy = 1 + A.br * 0.01 * Math.sin(t * TAU * F1 + p * 0.8);
  let e = 0;
  const cyc = (t * F0 + A.gp) % 1;
  if (cyc < A.gw) e = Math.sin(Math.PI * (cyc / A.gw));
  e *= e;
  return { ang: (ang + A.gsw * MOTION_GAIN * e) * Math.PI / 180, dy: dy + A.gdy * MOTION_GAIN * e, sy };
}

function drawActorLayer(g, im, A, t) {

  const px = A._cx, py = A.my + A.ry * (A.pv == null ? 0.72 : A.pv) - A.y;
  lg.setTransform(1, 0, 0, 1, 0, 0);
  lg.globalCompositeOperation = 'source-over';
  lg.clearRect(0, 0, L.w, L.h);
  lg.save();
  lg.translate(px, py + pose.dy + extraY);
  lg.rotate(pose.ang);
  lg.scale(1, pose.sy);
  lg.translate(-px, -py);
  lg.drawImage(im, A.x, A.y, A.w, A.h, 0, 0, A.w, A.h);
  lg.restore();
  lg.globalCompositeOperation = 'destination-in';
  lg.save();

  lg.beginPath(); lg.arc(0, 0, A._R, 0, TAU); lg.fill();
  lg.restore();
  lg.globalCompositeOperation = 'source-over';
  g.drawImage(L.c, A.x, A.y);
}

function wrapText(g, text, maxW) {
  const out = []; let line = '';
  for (const c of Array.from(text)) {
    const test = line + c;
    if (g.measureText(test).width > maxW && line) { out.push(line); line = c; }
    else line = test;
  }
  if (line) out.push(line);
  return out.slice(0, 3);
}
function drawBubbles(g, t) {
  for (const ch of chars) {
    if (!ch.visible || !ch.bubble || !ch.box) continue;
    const left = ch.bubbleUntil - t;
    if (left <= 0) continue;
    const age = t - ch.bubbleStart;
    const alpha = Math.min(1, age / 0.28, left / 0.4) * (ch.status === 'off' ? 0.5 : 1);
    const p = project(ch.lx, ch.ly);
    const bw0 = ch.box.w;
    g.save();
    g.globalAlpha = alpha;
    g.font = fw(700, 10.5);
    const padX = 9, padY = 6.5, lh = 14.5;
    const lines = wrapText(g, ch.bubble, 132);
    let tw = 0;
    for (const l of lines) tw = Math.max(tw, g.measureText(l).width);
    const bw = Math.min(150, tw + padX * 2);
    const bh = lines.length * lh + padY * 2 - 2;
    let bx = clamp(p.x - bw / 2, 4, vw - bw - 4);
    const by = Math.max(4, p.y - bh - 8);
    const clashes = (cx2) => chars.some(o => o !== ch && o.box &&
      cx2 < o.box.x + o.box.w + 2 && o.box.x < cx2 + bw + 2 &&
      by < o.box.y + o.box.h + 2 && o.box.y < by + bh + 2);
    if (clashes(bx)) {
      const step = Math.max(24, bw * 0.6);
      for (const dx of [-step, step, -2 * step, 2 * step]) {
        const cx2 = clamp(bx + dx, 4, vw - bw - 4);
        if (!clashes(cx2)) { bx = cx2; break; }
      }
    }
    const tailX = clamp(p.x, bx + 12, bx + bw - 12);
    // 꼬리
    g.fillStyle = 'rgba(255,252,246,0.98)';
    g.strokeStyle = 'rgba(30,24,18,0.16)'; g.lineWidth = 1;
    g.beginPath();
    g.moveTo(tailX - 5, by + bh - 1); g.lineTo(tailX + 1, by + bh + 7); g.lineTo(tailX + 5, by + bh - 1);
    g.closePath(); g.fill(); g.stroke();
    // 본체
    g.shadowColor = 'rgba(20,12,4,0.4)'; g.shadowBlur = 9; g.shadowOffsetY = 2;
    g.fillStyle = 'rgba(255,252,246,0.98)';
    rr(g, bx, by, bw, bh, 9); g.fill();
    g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.strokeStyle = 'rgba(30,24,18,0.10)'; rr(g, bx, by, bw, bh, 9); g.stroke();
    g.fillStyle = ch.color; g.fillRect(bx, by + 8, 2.5, bh - 16);
    g.fillStyle = '#33261a';
    g.textBaseline = 'top';
    lines.forEach((l, i) => g.fillText(l, bx + padX + 3, by + padY + i * lh));
    g.restore();
    g.textBaseline = 'alphabetic';
  }
}

/* =========================================================
   8. 시뮬레이션 · 렌더 루프
   ========================================================= */
function tickBubbles(t) {
  let active = 0;
  for (const ch of chars) { if (ch.bubble && t < ch.bubbleUntil) active++; }
  for (const ch of chars) {
    if (!ch.visible) continue;
    if (ch.bubble && t > ch.bubbleUntil) { ch.bubble = null; active--; }
    let near = false;
    for (const o of chars) {
      if (o === ch || !o.bubble || t > o.bubbleUntil) continue;
      if (Math.abs(o.lx - ch.lx) < 150 && Math.abs(o.ly - ch.ly) < 110) { near = true; break; }
    }
    if (!ch.bubble && !near && active < 3 && t > ch.nextBubble && ch.bubbles.length) {
      active++;
      ch.bubble = ch.bubbles[ch.bubbleIdx++ % ch.bubbles.length];
      ch.bubbleStart = t;
      ch.bubbleUntil = t + 5.0 + Math.random() * 2.4;
      ch.nextBubble = t + 11 + Math.random() * 14;
    }
  }
}
let lastT = 0;
function frame(now) {
  const tRaw = now / 1000;
  const t = loopP ? tRaw % loopP : tRaw;
  const dt = Math.min(0.05, lastT ? Math.abs(tRaw - lastT) : 0.016);
  lastT = tRaw;

  const k = 1 - Math.exp(-9 * dt);
  cam.x = lerp(cam.x, camT.x, k);
  cam.y = lerp(cam.y, camT.y, k);
  cam.zoom = lerp(cam.zoom, camT.zoom, k);
  camDrift = (userZoomed || !driftOn || loopP) ? { x: 0, y: 0, z: 1 } : {
    x: Math.sin(t * 0.10) * 12,
    y: Math.cos(t * 0.083) * 6.5,
    z: 1 + Math.sin(t * 0.055) * 0.010
  };

  const km = 1 - Math.exp(-4.2 * dt);
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i];
    if (!ch.visible) continue;
    ch.x = lerp(ch.x, ch.tx, km);
    ch.y = lerp(ch.y, ch.ty, km);
    ch.lx = lerp(ch.lx, ch.tlx, km);
    ch.ly = lerp(ch.ly, ch.tly, km);
    if (!ch.startAt) ch.startAt = 0.35 + i * 0.075;

  }
  if (loopP) tickLoopBubbles(t); else tickBubbles(t);

  phaseKey = phaseMode === 'auto' ? autoPhase(new Date().getHours()) : phaseMode;
  const ph = PHASES[phaseKey];

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, vw, vh);
  ctx.fillStyle = '#0a0908'; ctx.fillRect(0, 0, vw, vh);

  ctx.save();
  ctx.translate(vw / 2, vh / 2);
  ctx.scale(cam.zoom * camDrift.z, cam.zoom * camDrift.z);
  ctx.translate(-(cam.x + camDrift.x), -(cam.y + camDrift.y));

  const im = IMG[ph.img];
  if (im) {
    ctx.drawImage(im, 0, 0, W, H);
    drawActors(ctx, im, t);
  } else {
    ctx.fillStyle = '#3a2c22'; ctx.fillRect(0, 0, W, H);
  }
  if (ph.tint !== 'rgba(255,255,255,0)') { ctx.fillStyle = ph.tint; ctx.fillRect(0, 0, W, H); }

  drawWindowLife(ctx, t, ph);
  drawLamps(ctx, t, ph);
  drawScreenGlow(ctx, t);
  drawScreenLife(ctx, t, ph, im);
  drawMotes(ctx, t, ph);

  // 이름표는 화면 좌표로 (사진 위 오버레이 느낌)
  ctx.restore();

  drawVignette(ctx);
  layoutTags();
  const sorted = chars.filter(c => c.visible);
  for (const ch of sorted) drawTag(ctx, ch, t);
  drawBubbles(ctx, t);

  updateHud();
  requestAnimationFrame(frame);
}

function copyText(txt, okMsg) {
  const done = () => pushLog('해이', okMsg || '복사 완료', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); done();
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); done();
  }
}

      (st.shot ? '<div class="vshot"><img src="' + st.shot + '" alt="PC 화면 캡처"></div>' : '') +
    '</div>';
  } else if (st.msg) {
    card = '<div class="vcard"><div class="vwhy">' + escapeHtml(st.msg) + '</div></div>';
  }

  el.innerHTML =
    '<div class="vwrap">' +
      '<button id="vmic" class="vmic' + (st.listening ? ' on' : '') + '" aria-label="음성으로 지시">' + (st.listening ? '●' : '🎤') + '</button>' +
      '<div class="vstate' + (st.listening ? ' live' : '') + '" id="vstate">' +
        (st.listening ? '듣고 있어요… 말씀을 마치면 자동으로 멈춥니다' : '마이크를 누르고 말하면 지시가 담당 AI에게 배정됩니다') + '</div>' +
      '<textarea id="vtext" placeholder="예: PC 화면 캡처해서 보여줘 / 700곡 폴더 정리 지시해줘 / 오늘 이벤트 현황 요약">' + escapeHtml(st.text) + '</textarea>' +
      '<div class="vchips">' + presets.map(p => '<button data-preset="' + escapeHtml(p) + '">' + escapeHtml(p) + '</button>').join('') + '</div>' +
      '<div class="toolchips" style="margin-top:6px">' + TOOLS.map((T, i) => '<button data-vtool="' + i + '">' + T.i + ' ' + T.t + '</button>').join('') + '</div>' +
      '<button class="vgo" id="vgo">지휘 실행 · 담당자 배정</button>' +

      '<div class="mini">최근 지휘 <span style="float:right;color:#7b6a58;font-weight:700">' + (hist.length ? '<a href="#" id="vclear" style="color:#8a7660">기록 지우기</a>' : '') + '</span></div>' +
      (hist.length ? hist.map(h =>
        '<div class="vrow"><span class="t">' + escapeHtml(h.t || '') + '</span><span class="w">' + escapeHtml(h.who || '') + '</span>' +
        '<span class="x">' + escapeHtml(h.text || '') + '</span></div>').join('')
        : '<div class="empty">아직 지휘 내역이 없습니다</div>') +
      '<div class="mini">음성 인식이 안 되면 텍스트로 입력해도 됩니다 · 인식: ' + (speechSupported() ? '준비됨' : '이 브라우저 미지원') + '</div>' +
    '</div>';

  // 이벤트
  const mic = vEl('vmic');
  if (mic) mic.addEventListener('click', toggleMic);
  const ta = vEl('vtext');
  if (ta) {
    ta.addEventListener('input', () => { voiceState.text = ta.value; });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runVoice(); }
    });
  }
  el.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    voiceState.text = b.getAttribute('data-preset');

  }));
  el.querySelectorAll('[data-vtool]').forEach(b => b.addEventListener('click', () => runTool(+b.getAttribute('data-vtool'))));
  const go = vEl('vgo');
  if (go) go.addEventListener('click', () => { voiceState.text = (vEl('vtext') || {}).value || voiceState.text; analyzeVoice(); });
  el.querySelectorAll('[data-vact]').forEach(b => b.addEventListener('click', () => {
    const which = b.getAttribute('data-vact');
    if (which === 'primary') doPrimary();
    else doCopy();
  }));
  const clr = vEl('vclear');
  if (clr) clr.addEventListener('click', e => { e.preventDefault(); voiceSaveHistory([]); renderVoice(); });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function speechSupported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }

function analyzeVoice() {
  const text = (voiceState.text || '').trim();
  if (!text) { voiceState.msg = '지시를 먼저 입력하거나 마이크로 말해 주세요.'; voiceState.route = null; renderVoice(); return; }
  const r = routeVoice(text);
  voiceState.route = r;
  voiceState.prompt = buildPrompt(r, text);
  voiceState.msg = '';
  voiceState.shot = null;
  pushLog(r.who, '🎤 음성 지휘 접수 — ' + text.slice(0, 34), 'live');
  addVoiceHistory(text, r.who);
  renderVoice();
}
function addVoiceHistory(text, who) {
  const d = new Date();
  const list = voiceHistory();
  list.unshift({ t: pad2(d.getHours()) + ':' + pad2(d.getMinutes()), text, who });
  voiceSaveHistory(list);
}

async function pcCall(path, opt) {
  opt = opt || {};
  const cfg = pcCfg();
  if (!cfg || !cfg.bridge) throw new Error('PC 브릿지 주소가 없습니다. PC 컨트롤 대시보드에서 먼저 저장해 주세요.');
  const base = String(cfg.bridge).replace(/\/+$/, '');
  const headers = {};
  if (cfg.token) headers['X-Dashboard-Token'] = cfg.token;
  let body;
  if (opt.body) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(opt.body); }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), opt.timeout || 9000);
  try {
    const res = await fetch(base + path, { method: opt.method || 'GET', headers, body, cache: 'no-store', signal: ctrl.signal });
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new Error('HTTP ' + res.status + (data && data.error ? ' · ' + data.error : ''));
    return data;
  } finally {
    clearTimeout(timer);
  }
}

async function doPrimary() {
  const r = voiceState.route;
  if (!r) return;
  if (r.kind === 'prompt') { await doCopy(); return; }
  voiceState.busy = true; voiceState.msg = 'PC 브릿지로 보내는 중…'; renderVoice();
  try {
    if (r.kind === 'capture') {
      const d = await pcCall('/api/capture', { timeout: 22000 });
      if (d && d.image) { voiceState.shot = d.image; voiceState.msg = '캡처 완료 · ' + (d.width || '?') + '×' + (d.height || '?'); }
      else voiceState.msg = '캡처 응답에 이미지가 없습니다.';
    } else if (r.kind === 'status') {
      const d = await pcCall('/api/status', { timeout: 8000 });
      const bits = [];
      if (d) {
        if (d.cpu != null) bits.push('CPU ' + d.cpu + '%');
        if (d.mem != null || d.memory != null) bits.push('메모리 ' + (d.mem != null ? d.mem : d.memory) + '%');
        if (d.battery != null) bits.push('배터리 ' + d.battery + '%');
        if (d.host) bits.push(d.host);
      }
      voiceState.msg = bits.length ? 'PC 상태 · ' + bits.join(' · ') : 'PC 상태를 읽었습니다.';
    } else if (r.kind === 'launch') {
      let app = null;
      for (const pair of APP_MAP) if (voiceState.text.indexOf(pair[0]) >= 0) { app = pair[1]; break; }
      if (!app) { voiceState.msg = '어떤 앱을 실행할지 알 수 없어요. (크롬·카카오톡·노션·유튜브·줌 등)'; }
      else {
        const d = await pcCall('/api/launch', { method: 'POST', body: { app }, timeout: 14000 });
        voiceState.msg = (d && d.ok) ? (app + ' 실행을 보냈습니다.' + (d.via ? ' · ' + d.via : '')) : '앱 실행 응답을 받지 못했습니다.';
      }
    } else if (r.kind === 'clipboard') {
      await pcCall('/api/clipboard', { method: 'POST', body: { text: voiceState.prompt }, timeout: 9000 });
      voiceState.msg = 'PC 클립보드에 지시문을 넣었습니다. 실행 중인 에이전트에 붙여넣기만 하면 됩니다.';
    }
  } catch (e) {
    const m = String(e && e.message || e);
    voiceState.msg = '전송 실패 · ' + (/aborted|abort/i.test(m) ? 'PC 브릿지 응답이 없습니다(켜져 있는지 확인)' : m);
  }
  voiceState.busy = false;
  renderVoice();
}

async function doCopy() {
  const txt = voiceState.prompt || '';
  if (!txt) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(txt);
    else {
      const t = document.createElement('textarea');
      t.value = txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
    }
    voiceState.msg = '노션 지휘 프롬프트를 복사했습니다. 다른 AI 앱에 붙여넣으세요.';
  } catch (e) {
    voiceState.msg = '복사가 막혔어요. 아래 프롬프트를 길게 눌러 직접 복사해 주세요.';
  }
  renderVoice();
}

function toggleMic() {
  if (voiceState.listening) { stopMic(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    voiceState.msg = '이 브라우저는 음성 인식을 지원하지 않아요. 텍스트로 입력해 주세요.';
    renderVoice();
    return;
  }
  const rec = new SR();
  rec.lang = 'ko-KR';
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 1;
  voiceState.rec = rec;
  rec.onstart = () => { voiceState.listening = true; voiceState.msg = ''; renderVoice(); };
  rec.onresult = (e) => {
    let txt = '';
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    voiceState.text = txt;
    const ta = vEl('vtext');
    if (ta) ta.value = txt;
  };
  rec.onerror = (e) => {
    voiceState.listening = false;
    voiceState.msg = e.error === 'not-allowed' ? '마이크 권한이 꺼져 있어요. 브라우저 설정에서 허용해 주세요.'
      : e.error === 'no-speech' ? '소리가 들리지 않았어요. 다시 한 번 눌러 말해 주세요.'
      : '음성 인식 오류(' + e.error + ') · 텍스트로 입력해 주세요.';
    renderVoice();
  };
  rec.onend = () => {
    voiceState.listening = false;
    renderVoice();
    if (voiceState.text.trim()) analyzeVoice();
  };
  try { rec.start(); } catch (e) {
    voiceState.msg = '마이크를 시작하지 못했어요. 잠시 뒤 다시 눌러 주세요.';
    renderVoice();
  }
}
function stopMic() {
  try { if (voiceState.rec) voiceState.rec.stop(); } catch (e) {}
  voiceState.listening = false;
  renderVoice();
}

function chatPickTopic(text) {
  const low = String(text || '').toLowerCase();
  let best = null, bestScore = 0;
  for (const t of CHAT_TOPICS) {
    let score = 0;
    for (const k of t.kw) if (low.indexOf(String(k).toLowerCase()) >= 0) score += k.length;
    if (score > bestScore) { bestScore = score; best = t; }
  }
  return best;
}
function chatAsk(text) {

  const log = chatLog();
  chatPush(log, 'ceo', text);
  const topic = chatPickTopic(text);
  const turns = topic ? topic.turns : CHAT_FALLBACK;
  const intro = topic ? topic.intro : ('「' + text + '」 안건으로 접수했습니다.');
  chatBusy = true;
  let delay = 650;
  const seq = [['haei', intro]].concat(turns);
  seq.forEach((pair, i) => {
    const who = pair[0], txt = pair[1];
    setTimeout(() => {
      chatSetTyping(who);
      renderChat();
      setTimeout(() => {
        const list = chatLog();
        chatSetTyping('');
        list.push({ w: who, t: txt, at: Date.now() });
        chatSave(list);
        renderChat();
        if (i === seq.length - 1) chatBusy = false;
      }, 700 + Math.random() * 500);
    }, delay);
    delay += 1250 + Math.random() * 400;
  });
}

const pointers = new Map();
let dragMoved = false, downTime = 0, pinchStart = 0, pinchZoom0 = 1;
function cpos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, cpos(e));
  dragMoved = false; downTime = performance.now();
  if (pointers.size === 2) {
    const [a, b] = Array.from(pointers.values());
    pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
    pinchZoom0 = cam.zoom;
  }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId), p = cpos(e);
  pointers.set(e.pointerId, p);
  if (pointers.size === 2) {
    const [a, b] = Array.from(pointers.values());
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchStart > 10) {
      const z = clamp(pinchZoom0 * (d / pinchStart), fitZoom() * 0.9, 3.0);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const wx = (mx - vw / 2) / cam.zoom + cam.x, wy = (my - vh / 2) / cam.zoom + cam.y;
      cam.zoom = z; camT.zoom = z;
      cam.x = wx - (mx - vw / 2) / z; cam.y = wy - (my - vh / 2) / z;
      camT.x = cam.x; camT.y = cam.y; userZoomed = true;
      clampCam(camT); cam.x = camT.x; cam.y = camT.y;
    }
    dragMoved = true;
    return;
  }
  const dx = p.x - prev.x, dy = p.y - prev.y;
  if (Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
  if (dragMoved) {
    cam.x -= dx / cam.zoom; cam.y -= dy / cam.zoom;
    camT.x = cam.x; camT.y = cam.y;
    clampCam(camT); cam.x = camT.x; cam.y = camT.y;
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size === 0 && !dragMoved && performance.now() - downTime < 620) {
    let best = null, bd = 1e9;
    for (const ch of chars) {
      if (!ch.visible || !ch.box) continue;
      const b = ch.box;
      if (p.x >= b.x - 4 && p.x <= b.x + b.w + 4 && p.y >= b.y - 4 && p.y <= b.y + b.h + 4) {
        const d = Math.hypot(p.x - (b.x + b.w / 2), p.y - (b.y + b.h / 2));
        if (d < bd) { bd = d; best = ch; }
      }
    }
    if (!best) {
      // 이름표 밖: 가까운 이름표(반경 40px)도 허용
      for (const ch of chars) {
        if (!ch.visible || !ch.box) continue;
        const b = ch.box;
        const d = Math.hypot(p.x - (b.x + b.w / 2), p.y - (b.y + b.h / 2));
        if (d < 40 && d < bd) { bd = d; best = ch; }
      }
    }
    if (best) selectStaff(best.id, false);
    else if (selectedId) { selectedId = null; renderStaff(); }
  }
}
cv.addEventListener('pointerup', endPointer);

async function poll() {
  try {
    const res = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const txt = await res.text();
    if (txt === lastRaw) return;
    lastRaw = txt;
    const d = JSON.parse(txt);
    if (applyStatus(d)) pushLog('해이', 'status.json 갱신 반영', 'live');

  },
  chars: () => chars.map(c => ({ id: c.id, name: c.name, status: c.status, x: Math.round(c.lx), y: Math.round(c.ly), pose: 'seated', moving: false })),
  voice: { run: analyzeVoice, route: routeVoice, prompt: buildPrompt, text: t => { voiceState.text = t; return voiceState.text; } },
  tv: { open: openTV, close: closeTV, spots: TV_SPOTS.map(s => s.path) },
  chat: { ask: chatAsk, log: chatLog, clear: () => { chatSave([]); renderChat(); }, topics: CHAT_TOPICS.map(t => t.label) },
  boxes: () => chars.filter(c => c.visible && c.box).map(c => ({ id: c.id, x: Math.round(c.box.x), y: Math.round(c.box.y), w: c.box.w, h: c.box.h })),
  phase: () => phaseKey,
  zoom: () => cam.zoom
};
boot();
})();
</script>
