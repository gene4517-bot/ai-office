<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>모바일 뷰포트 미리보기 · AI 지휘실</title>
<style>
  body { margin:0; background:#0b0c10; color:#e8e8ea; padding:16px;
         font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic',sans-serif;
         display:flex; gap:16px; justify-content:center; align-items:flex-start; flex-wrap:wrap; }
  .ph { background:#000; border-radius:38px; padding:9px 9px 13px;
        box-shadow:0 18px 46px rgba(0,0,0,.65), 0 0 0 1px #262830; }
  .cap { display:flex; justify-content:space-between; gap:10px; padding:2px 7px 8px;
         font-size:12px; font-weight:800; color:#c3c6d0; letter-spacing:-.2px; }
  .cap span:last-child { color:#6d7180; font-weight:700; }
  iframe { width:390px; height:800px; border:0; border-radius:27px; background:#0b0908; display:block; }
</style>
</head>
<body>
  <div class="ph">
    <div class="cap"><span>💬 AI 직원 단톡방 · 회의 중</span><span>390 × 800</span></div>
    <iframe id="f1" src="../index.html?tab=chat" title="단톡방 미리보기"></iframe>
  </div>
  <div class="ph">
    <div class="cap"><span>🎛️ gene 덱 · 세계 무료 TV 타일</span><span>390 × 800</span></div>
    <iframe id="f2" src="../dashboard/" title="gene 덱 미리보기"></iframe>
  </div>
  <div class="ph">
    <div class="cap"><span>📺 세계 무료 TV · AI 지휘실 간편 뷰</span><span>390 × 800</span></div>
    <iframe id="f3" src="../index.html?tv=tv/kr" title="세계 무료 TV 미리보기"></iframe>
  </div>
  <div class="ph">
    <div class="cap"><span>📺 세계 무료 TV · gene 덱 간편 뷰</span><span>390 × 800</span></div>
    <iframe id="f4" src="../dashboard/?tv=tv/kr" title="덱 TV 미리보기"></iframe>
  </div>
<script>
  /* 미리보기용: 단톡방에서 회의 한 건을 돌리고, 답변이 끝나면 첫 안건을 맨 위에 오게 스크롤 */
  function seedChat() {
    try {
      var w = document.getElementById('f1').contentWindow;
      if (w && w.AI_OFFICE && w.AI_OFFICE.chat) {
        w.AI_OFFICE.chat.clear();
        w.AI_OFFICE.chat.ask('수입 파이프라인 회의');
        return true;
      }
    } catch (e) {}
    return false;
  }
  var seedTry = 0;
  var seedTimer = setInterval(function () {
    if (seedChat() || ++seedTry > 30) clearInterval(seedTimer);
  }, 300);

  var waitTry = 0;
  setInterval(function () {
    if (++waitTry > 120) return;
    try {
      var w = document.getElementById('f1').contentWindow;
      var d = w.document;
      var send = d.getElementById('chatSend');
      var box = d.getElementById('chatLog');
      var me = d.querySelector('#chatLog .cmsg.me');
      if (!send || send.disabled || !box || !me) return;
      box.scrollTop += (me.getBoundingClientRect().top - box.getBoundingClientRect().top) - 8;
    } catch (e) {}
  }, 500);
</script>
</body>
</html>
